name: Публикация релиза

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Настройка JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Кеширование Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Полная проверка (форматирование, статический анализ, тесты)
        run: |
          ./gradlew spotlessCheck --no-daemon
          ./gradlew checkstyleMain checkstyleTest --no-daemon
          ./gradlew test --no-daemon

      - name: Сборка итогового JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Контрольная сумма SHA-256
        run: |
          cd build/libs
          for f in TMCStaffWork-*.jar; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Публикация GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/TMCStaffWork-*.jar
            build/libs/TMCStaffWork-*.jar.sha256
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
