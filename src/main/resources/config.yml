# =========================================================================
#  TMC StaffWork — основная конфигурация
#  Версия плагина: ${version}
# =========================================================================

# Версия схемы конфигурации. Не изменяйте вручную — плагин сам обновит недостающие
# ключи при повышении версии и выставит актуальное значение.
config-version: 1

# Идентификатор ЭТОГО сервера в сети (важно при общей базе MySQL/MariaDB на несколько
# серверов — сессии и статистика помечаются им). Разрешены только латиница, цифры, "-" и "_".
server-id: "server1"

# Часовой пояс для расчёта периодов статистики (сегодня/неделя/месяц) и вывода дат.
# Время в базе данных всегда хранится в UTC — часовой пояс влияет только на отображение
# и на то, где проходит граница "сегодня"/"эта неделя"/"этот месяц".
# Формат — идентификатор IANA, например: "Europe/Moscow", "Europe/Kyiv", "UTC".
timezone: "Europe/Moscow"

storage:
  # Тип хранилища: yaml | sqlite | h2 | mysql
  # ВНИМАНИЕ: изменение типа хранилища требует полного перезапуска сервера — "/staffwork reload"
  # его не применит и явно предупредит об этом.
  type: sqlite

  yaml:
    # Файл относительно папки плагина (plugins/TMCStaffWork/).
    file: "data.yml"

  sqlite:
    file: "database.db"

  h2:
    file: "database"

  mysql:
    host: "localhost"
    port: 3306
    database: "tmc_staffwork"
    username: "root"
    password: ""
    use-ssl: false
    # Размер пула соединений HikariCP.
    pool-size: 10

work-time:
  # Статусы, которые засчитываются как рабочее время при расчёте статистики.
  # По умолчанию: WORKING, MEETING, TRAINING считаются работой; AFK, OFF_DUTY, BREAK — нет.
  counted-statuses:
    - WORKING
    - MEETING
    - TRAINING

auto-status:
  # Статус, устанавливаемый сотруднику автоматически при входе на сервер.
  # Оставьте пустой строкой (""), чтобы не менять статус при входе.
  status-on-join: "WORKING"

  # Начинать ли рабочую сессию автоматически при входе, если она ещё не открыта.
  auto-start-session-on-join: true

  # Поведение при выходе сотрудника с сервера:
  #   stop-session — завершить активную рабочую сессию;
  #   set-status   — не завершать сессию, а лишь сменить статус (см. status-on-quit);
  #   nothing      — ничего не делать (сессия и статус сохраняются как есть).
  on-quit: "stop-session"
  status-on-quit: "OFF_DUTY"

  afk:
    # Автоматический перевод в AFK по бездействию. Активность отслеживается стандартными
    # действиями игрока (движение, чат, команды, взаимодействие) — без анализа сетевых пакетов.
    enabled: true
    threshold-seconds: 300
    # Автоматически возвращать из AFK в предыдущий статус при первом действии игрока.
    auto-return: true

placeholders:
  # Цвета статусов для PlaceholderAPI (%tmcstaff_staff_status_color%) и внутреннего
  # отображения. Допустимые имена — стандартные цвета Minecraft (green, red, yellow, gray, ...).
  status-colors:
    WORKING: "green"
    AFK: "yellow"
    OFF_DUTY: "red"
    BREAK: "gray"
    MEETING: "gray"
    TRAINING: "gray"

telegram:
  # Интеграция выключена по умолчанию. Токен бота НИКОГДА не должен попадать в систему
  # контроля версий — храните его только в этом локальном файле на сервере.
  enabled: false
  bot-token: ""

  # Интервал long polling к Telegram Bot API. Публичный порт не открывается.
  poll-interval-seconds: 3

  # Срок действия одноразового кода привязки аккаунта.
  link-code-ttl-seconds: 300

  rate-limit:
    max-attempts: 5
    window-seconds: 60

  events:
    session-start: true
    session-stop: true
    login: true
    logout: true

  # Шаблоны сообщений. Доступные плейсхолдеры: {player}, {duration}.
  messages:
    start: "Отправьте код привязки, выданный командой /staffwork telegram link в игре."
    link-success: "Аккаунт успешно привязан к Minecraft-профилю!"
    link-invalid: "Код неверен или истёк. Получите новый код командой /staffwork telegram link в игре."
    link-rate-limited: "Слишком много попыток. Подождите немного и попробуйте снова."
    login: "🟢 {player} зашёл на сервер."
    logout: "🔴 {player} вышел с сервера."
    session-start: "▶️ {player} начал рабочую смену."
    session-stop: "⏹️ {player} завершил рабочую смену. Длительность: {duration}."

recovery:
  # Как часто плагин отмечает, что этот сервер "жив" — используется, чтобы после аварийной
  # остановки корректно оценить момент завершения незакрытых рабочих сессий.
  heartbeat-interval-seconds: 30
